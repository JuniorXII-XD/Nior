 drift{to{transform:translateX(-10vw) rotate(21deg);opacity:.5}}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){body{padding:100px 22px}.topline{top:26px;left:25px;right:25px}.card{padding:37px 24px 27px;border-radius:25px}.name{font-size:2.8rem}.topline span:last-child{font-size:.75rem}.social{padding:16px 14px;gap:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-height:620px){.bottom{position:static;margin-top:38px}body{padding-top:95px;padding-bottom:20px}}

.geometry{position:absolute;inset:0;perspective:1000px;pointer-events:none}

.face:nth-child(1){transform:translateZ(calc(var(--size)/2))}.face:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--size)/2))}.face:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--size)/2))}.face:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--size)/2))}.face:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--size)/2))}.face:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--size)/2))}
.ring{border-radius:50%;background:none;border-color:#c6cef3aa}.ring:nth-child(2){transform:rotateY(90deg)}.ring:nth-child(3){transform:rotateX(90deg)}
.diamond{transform:rotateZ(45deg);background:linear-gradient(135deg,#b0c1ee35,#727d9d0a)}.diamond:nth-child(2){transform:rotateY(90deg) rotateZ(45deg)}
.scene-paused .shape,.scene-paused .spin,.scene-paused .beam{animation-play-state:paused}

<script>
(() => {
  const ambient = document.querySelector('.ambient');
  const geometry = document.createElement('div');
  geometry.className = 'geometry';
  geometry.setAttribute('aria-hidden', 'true');
  const field = document.createElement('div');
  field.className = 'geometry-field';
  // Spread the first 16 across the screen so mobile retains the whole composition.
  const positions = [[8,12],[82,14],[16,78],[88,81],[3,45],[92,44],[34,6],[64,91],
    [21,26],[73,30],[25,92],[70,70],[5,65],[91,61],[48,9],[47,86],
    [36,23],[61,18],[12,91],[85,6],[34,70],[63,79],[9,31],[83,93]];
  positions.forEach(([left,top], i) => {
    const shape = document.createElement('div'); shape.className = 'shape';
    const size = [42,62,28,48,34,54][i % 6];
    const values = {'--left':left+'%','--top':top+'%','--size':size+'px',
      '--alpha':String([.40,.29,.50,.34][i%4]),'--depth':(-30-(i%4)*45)+'px',
      '--drift':(i%2?18:-18)+'px','--float-time':(9+i%6*2)+'s',
      '--spin-time':(32+i%7*7)+'s','--delay':(-i*3.7)+'s'};
    Object.entries(values).forEach(([k,v])=>shape.style.setProperty(k,v));
    const spin = document.createElement('div'); spin.className = 'spin';
    const type = ['face','ring','diamond'][i%3];
    for(let j=0;j<({face:6,ring:3,diamond:2}[type]);j++) {
      const surface=document.createElement('i');surface.className=type;spin.append(surface);
    }
    shape.append(spin);field.append(shape);
  });
  geometry.append(field);ambient.append(geometry);
  const pause = () => ambient.classList.toggle('scene-paused', document.hidden);
  document.addEventListener('visibilitychange', pause);pause();
})();
</script>
<script>
(() => {
  const card = document.querySelector('.card');
  const stage = document.querySelector('main');
  const ambient = document.querySelector('.ambient');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let targetX = 0, targetY = 0, x = 0, y = 0, shine = 0, targetShine = 0;
  let frame = 0, lastTime = 0, touchId = null, touchStart = null, dragged = false;
  const clamp = n => Math.max(-1, Math.min(1, n));
  function render(time) {
    const dt = lastTime ? Math.min(time - lastTime, 50) : 16.7;
    lastTime = time;
    const ease = 1 - Math.exp(-dt / 95);
    x += (targetX - x) * ease; y += (targetY - y) * ease;
    shine += (targetShine - shine) * ease;
    card.style.setProperty('--rx', `${-y * 11}deg`);
    card.style.setProperty('--ry', `${x * 14}deg`);
    card.style.setProperty('--lx', `${50 + x * 45}%`);
    card.style.setProperty('--ly', `${50 + y * 45}%`);
    card.style.setProperty('--shine', shine.toFixed(3));
    card.style.setProperty('--sx', `${-x * 24}px`);
    card.style.setProperty('--sy', `${30 - y * 15}px`);
    ambient.style.setProperty('--px', `${-x * 20}px`);
    ambient.style.setProperty('--py', `${-y * 20}px`);
    ambient.style.setProperty('--gx', `${x * 100}px`);
    ambient.style.setProperty('--gy', `${y * 70}px`);
    if (Math.abs(targetX-x)+Math.abs(targetY-y)+Math.abs(targetShine-shine) > .001) {
      frame = requestAnimationFrame(render);
    } else { frame = 0; lastTime = 0; }
  }
  function animate() { if (!frame) frame = requestAnimationFrame(render); }
  function point(event) {
    if (reduced.matches) return;
    const bounds = stage.getBoundingClientRect();
    const cx = bounds.left + card.offsetLeft + card.offsetWidth / 2;
    const cy = bounds.top + card.offsetTop + card.offsetHeight / 2;
    targetX = clamp((event.clientX - cx) / (card.offsetWidth / 2));
    targetY = clamp((event.clientY - cy) / (card.offsetHeight / 2));
    targetShine = 1; animate();
  }
  function reset() {
    targetX = targetY = targetShine = 0;
    touchId = null; touchStart = null;
    animate();
  }
  window.addEventListener('pointermove', event => {
    if (event.pointerType === 'mouse') point(event);
    else if (event.pointerId === touchId) {
      if (touchStart && Math.hypot(event.clientX-touchStart.x,event.clientY-touchStart.y)>8) dragged=true;
      point(event);
    }
  }, {passive:true});
  card.addEventListener('pointerdown', event => {
    dragged = false;
    if (event.pointerType === 'mouse') return;
    touchId = event.pointerId; touchStart = {x:event.clientX,y:event.clientY}; dragged = false;
    point(event);
  }, {passive:true});
  card.addEventListener('click', event => {
    if (dragged && event.detail !== 0) { event.preventDefault(); dragged = false; }
  }, true);
  window.addEventListener('pointerup', event => {if(event.pointerId===touchId) reset();}, {passive:true});
  window.addEventListener('pointercancel', reset, {passive:true});
  document.documentElement.addEventListener('pointerleave', reset, {passive:true});
  window.addEventListener('blur', reset);
  document.addEventListener('visibilitychange', () => {if(document.hidden) reset();});
  reduced.addEventListener('change', reset);
})();
</script>
